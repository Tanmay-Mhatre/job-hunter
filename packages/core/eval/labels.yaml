# Relevance labels: one per profile x posting pair.
#
# Rubric (judge from the profile's `about` and the full posting; never from the scorer's output).
# The question behind every label: would this person, triaging their inbox, apply?
#   4 Strong   would apply today: meets the must-haves, right level, no dealbreaker.
#   3 Good     worth applying: minor gaps only (a nice-to-have, one level below, adjacent domain, a key unknown).
#   2 Stretch  plausible but a real gap (a missing must-have, new domain, one level up without its must-haves).
#   1 Poor     same field but clearly wrong (domain-locked or wrong specialisation, far level, two real gaps).
#   0 No       not relevant, or a dealbreaker (different job, a stated dealbreaker, visa / location / salary blocker).
#
# Tie-break rules, applied in order. Each fact gives a cap; the label is the lowest cap.
#   1. Dealbreakers -> 0. Anything the candidate lists as a dealbreaker, including a specialisation
#      (frontend, marketing-only design, credit risk, AP/AR, insurance sales, operations, agency, junior),
#      a location or relocation they rule out, and "no sponsorship" for someone who needs it.
#   2. Different job -> 0. The day-to-day work is another profession and the candidate's core skills aren't
#      what it uses, whatever the title words or industry share (an IT business analyst for an FP&A analyst).
#   3. Salary, base and same period, against the stated floor, using the top of the range:
#        top >= floor (above or straddling)        no gap
#        top below the floor by up to 5%           real gap (cap 2): negotiable at a stretch
#        top below the floor by more than 5%       blocker (0)
#        no salary stated                          no gap; judged on the rest
#   4. Unknowns cap, they don't subtract, and they don't stack:
#        title-only posting (no description)       cap 3: the must-haves can't be checked; lower if the title
#                                                  itself shows a gap
#        sponsorship not stated or only "for exceptional candidates", for someone who needs it   cap 3
#        a requirement the candidate's `about` doesn't mention (e.g. a language)  counts as not met
#   5. Level, on the ladder junior < mid < senior < lead/staff < director/principal:
#        the candidate's level or their stated next step, with the must-haves met    no gap
#        one level below                           minor gap (cap 3); junior when ruled out -> 0
#        one level up that they aren't ready for, missing its level-defining must-haves
#        (years, staff scope, people management)   real gap (cap 2)
#        two or more levels away, or required years at least double theirs           far (cap 1)
#      Years: having at least two-thirds of a stated minimum is no gap at the right level; the
#      requirements that define a level gap are that one gap, not extra gaps.
#   6. Function and domain:
#        same job, adjacent domain (knowledge transfers, domain only nice-to-have)  minor (cap 3)
#        same job, new domain where domain knowledge is a must-have                 real gap (cap 2)
#        same job, but the domain is locked in as required years or a network in it  wrong specialisation (cap 1)
#        adjacent function (product owner vs PM, partnerships vs AE, UX research vs product design,
#        DevOps/SRE vs platform): same work under another name -> no gap; must-haves accept the
#        candidate's function -> minor (cap 3); must-haves need years in the other function that the
#        candidate has only done in part -> real gap (cap 2); not at all -> cap 1
#   7. Combining: any number of minor gaps stays 3 (three or more -> 2); two real gaps -> 1.
#      A partly met must-have is a minor gap; an unmet one is a real gap.
#      Exception: in a neighbouring-function posting, the must-haves that define that function are judged by
#      rule 6 (done only in part = real gap, cap 2).
#
# by: draft = labelled by Claude from the first rubric; by: reconciled = re-labelled under the rules above after
# comparing with a blind second labeller; by: user = confirmed or corrected by a person.

