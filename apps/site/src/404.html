/* Theme: same as the home page. Follow the OS; add -hc for increased contrast. */
(function () {
  var r = document.documentElement, t = r.getAttribute('data-theme');
  var dark = t ? t.indexOf('dark') === 0 : matchMedia('(prefers-color-scheme: dark)').matches;
  var more = matchMedia('(prefers-contrast: more)').matches;
  r.setAttribute('data-theme', (dark ? 'dark' : 'light') + (more ? '-hc' : ''));
})();
</script>
