<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title><style>html,body{margin:0}body{background:var(--bg-canvas);color:var(--text-primary);padding:16px}.stack{display:grid;gap:16px}.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.cap{font:var(--text-meta,400 12px/16px var(--font-sans));color:var(--text-secondary);margin:0}</style></head>
<body class="rj-root">
<div class="stack">
<div class="wrap">
<button class="rj-btn rj-btn--primary" type="button"><svg class="rj-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></svg>Scan now <span class="rj-kbd">R</span></button>
<button class="rj-btn" type="button">Check this company</button>
<button class="rj-btn rj-btn--quiet" type="button">Not interested</button>
<button class="rj-btn rj-btn--danger" type="button">Remove company</button>
</div>
<div class="wrap">
<button class="rj-btn rj-btn--sm" type="button"><svg class="rj-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Open posting</button>
<button class="rj-btn rj-btn--quiet rj-btn--icon" type="button" aria-label="Copy job description" title="Copy job description (C)"><svg class="rj-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
<button class="rj-btn rj-btn--quiet rj-btn--icon" type="button" aria-label="More actions" title="More actions"><svg class="rj-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
<button class="rj-btn" type="button" disabled>Scanning…</button>
</div>
</div>
</body></html>
