<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Status</title><style>html,body{margin:0}body{background:var(--bg-canvas);color:var(--text-primary);padding:16px}.stack{display:grid;gap:16px}.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.cap{font:var(--text-meta,400 12px/16px var(--font-sans));color:var(--text-secondary);margin:0}</style></head>
<body class="rj-root">
<div class="stack">
<div class="wrap">
<span class="rj-status rj-status--healthy"><i class="rj-glyph rj-glyph--full"></i><span class="rj-status__label">Healthy</span></span>
<span class="rj-status rj-status--dormant"><i class="rj-glyph rj-glyph--half"></i><span class="rj-status__label">Dormant</span></span>
<span class="rj-status rj-status--broken"><i class="rj-glyph rj-glyph--slash"></i><span class="rj-status__label">Broken link</span></span>
</div>
<p class="cap">Filled square: healthy or strong. Half: dormant or fair. Empty: weak. Slashed: broken.</p>
</div>
</body></html>
