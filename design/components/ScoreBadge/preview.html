<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ScoreBadge</title><style>html,body{margin:0}body{background:var(--bg-canvas);color:var(--text-primary);padding:16px}.stack{display:grid;gap:16px}.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.cap{font:var(--text-meta,400 12px/16px var(--font-sans));color:var(--text-secondary);margin:0}</style></head>
<body class="rj-root">
<div class="stack">
<div class="wrap"><span class="rj-score rj-score--strong" role="img" aria-label="Strong match, score 74"><i class="rj-glyph rj-glyph--full"></i>74</span><span class="rj-score rj-score--fair" role="img" aria-label="Fair match, score 58"><i class="rj-glyph rj-glyph--half"></i>58</span><span class="rj-score rj-score--weak" role="img" aria-label="Weak match, score 23"><i class="rj-glyph rj-glyph--empty"></i>23</span><span class="cap">fetched: full description scored</span></div>
<div class="wrap"><span class="rj-score rj-score--strong rj-score--estimated" role="img" aria-label="Strong match, score 68, estimated"><i class="rj-glyph rj-glyph--full"></i>~68</span><span class="rj-score rj-score--fair rj-score--estimated" role="img" aria-label="Fair match, score 56, estimated"><i class="rj-glyph rj-glyph--half"></i>~56</span><span class="rj-score rj-score--weak rj-score--estimated" role="img" aria-label="Weak match, score 21, estimated"><i class="rj-glyph rj-glyph--empty"></i>~21</span><span class="cap">estimated: title, place and date only</span></div>
<div class="wrap"><span class="rj-score rj-score--strong rj-score--lg" role="img" aria-label="Strong match, score 74"><i class="rj-glyph rj-glyph--full"></i>74</span><span class="cap">drawer size</span></div>
</div>
</body></html>
